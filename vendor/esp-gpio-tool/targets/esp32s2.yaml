features:
  cpu:
    cores:
      count: 1
      max_freq_mhz: 240
  memory:
    internal:
      sram_kb: 320
      lp_sram_kb: 16
  connectivity:
    wifi:
      supported: true
      standard: 802.11b/g/n
      max_data_rate_mbps: 150
    bluetooth:
      supported: false
    ieee_802154:
      supported: false
    ethernet:
      mac: false
    usb:
      otg_fs_2_0: true
      usb_serial_jtag: false

peripheral:
  ADC:
    count: 2
    channels: 10
    assigned_pins: ['ADC{count}_CH{{channel}}']
  DAC:
    count: 2
    assigned_pins: ['DAC_{count}']
  UART:
    count: 2
    assigned_pins: ['U{count}TXD', 'U{count}RXD', 'U{count}CTS', 'U{count}RTS', 'U{count}DTR', 'U{count}DSR']
    universal_pins: ['U{count}DTR', 'U{count}DSR']
  JTAG:
    count: 1
    assigned_pins: [MTCK, MTDO, MTMS, MTDI]
  TOUCH:
    count: 14
    start_cnt: 1
    assigned_pins: ['TOUCH{count}']
  I2C:
    count: 2
    universal_pins: ['I2C{count}_SCL', 'I2C{count}_SDA']
  I2S:
    count: 1
    universal_pins: ['I2S{count}_WS', 'I2S{count}_SD', 'I2S{count}_CLK']
  SPI:
    # SPI0 uses the same pins as SPI1 so actual count is 3
    count: 3  # SPI0, SPI1, SPI2, SPI3
    subname: [SPI, FSPI, SPI3]
    modes:
      SPI: [Single SPI, Dual SPI, Quad SPI, Octal SPI, QPI, OPI]
      FSPI: [Single SPI, Dual SPI, Quad SPI, Octal SPI, QPI, OPI]
      SPI3: [Single SPI]
    # Note: D -> MOSI, Q -> MISO, CLK -> CLK, CS0 -> CS
    # SPI has 2 CS pins, FSPI has 6 CS pins, SPI3 has 3 CS pins
    # SPI3HD and SPI3DQS are mentioned in the datasheet, but SPI3 does not support quad mode where these could be used (also SPI3WP is not mentioned), so they are not included in the following list
    # SPICD and FSPICD are mentioned in the datasheet, but they are not included in the following list because they are not used in any other chip
    assigned_pins: [SPICLK, SPIQ, SPID, SPIHD, SPIWP, SPIIO4, SPIIO5, SPIIO6, SPIIO7, SPIDQS, SPICS0, SPICS1, FSPICLK, FSPIQ, FSPID, FSPIHD, FSPIWP, FSPIIO4, FSPIIO5, FSPIIO6, FSPIIO7, FSPIDQS, FSPICS0]
    universal_pins: [FSPICS1, FSPICS2, FSPICS3, FSPICS4, FSPICS5, SPI3CLK, SPI3Q, SPI3D, SPI3CS0, SPI3CS1, SPI3CS2]
  CLKOUT:
    count: 3
    assigned_pins: ['CLK_OUT{count}']
  RMT:
    count: 1
    universal_pins: ['RMT_SIG_IN{count}', 'RMT_SIG_OUT{count}']
  LEDC:  # LED PWM
    count: 1
    channels: 8
    universal_pins: ['LEDC_LS_SIG_OUT{channel}']
  TWAI:
    count: 1
    universal_pins: [TWAI_RX, TWAI_TX, TWAI_BUS_OFF_ON, TWAI_CLKOUT]
  PCNT:  # Pulse Counter
    count: 4
    channels: 2
    universal_pins: ['PCNT_SIG_CH{{channel}}_IN{count}', 'PCNT_CTRL_CH{{channel}}_IN{count}']
  XTAL32K:  # external 32K crystal oscillator
    count: 1
    assigned_pins: [XTAL_32K_P, XTAL_32K_N]
  USBOTG:  # Full Speed USB OTG
    count: 1
    # Part "OTG" is not specified by the datasheet, it is only for the later resolution by the checker
    assigned_pins: [USB_OTG_D-, USB_OTG_D+]
  LCDCAM:  # LCD and Camera Controller (LCD_CAM)
    count: 1
    subname: [LCD, CAM]
    channels: 16
    universal_pins: ['{subname}_PCLK', LCD_DC, CAM_CLK, '{subname}_V_SYNC', '{subname}_H_SYNC', '{subname}_H_ENABLE', '{subname}_DATA{{channel}}']
    modes:
      LCD: [8 bit - Master TX Mode, 16 bit - Master TX Mode]
      CAM: [8 bit - Slave RX Mode, 16 bit - Slave RX Mode, 8 bit - Master RX Mode, 16 bit - Master RX Mode]

# Note: PUP (wpu in datasheet) - pull up resistor enabled; PDOWN (wpd) - pull down resistor enabled

gpio:
  0: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [], strapping: High for SPI Boot; Low for Download Mode, at_reset: PUP}
  1: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH1, ADC1_CH0]}
  2: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH2, ADC1_CH1]}
  3: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH3, ADC1_CH2]}
  4: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH4, ADC1_CH3]}
  5: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH5, ADC1_CH4]}
  6: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH6, ADC1_CH5]}
  7: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH7, ADC1_CH6]}
