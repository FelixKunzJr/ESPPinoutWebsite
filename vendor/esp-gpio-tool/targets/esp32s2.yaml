  10: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH10, ADC1_CH9, FSPIIO4, FSPICS0]}
  11: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH11, ADC2_CH0, FSPIIO5, FSPID]}
  12: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH12, ADC2_CH1, FSPIIO6, FSPICLK]}
  13: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH13, ADC2_CH2, FSPIIO7, FSPIQ]}
  14: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [TOUCH14, ADC2_CH3, FSPIDQS, FSPIWP]}
  15: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [XTAL_32K_P, ADC2_CH4, U0RTS]}
  16: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [XTAL_32K_N, ADC2_CH5, U0CTS]}
  17: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [DAC_1, ADC2_CH6, U1TXD]}
  18: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [DAC_2, ADC2_CH7, U1RXD, CLK_OUT3]}
  19: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [USB_OTG_D-, ADC2_CH8, U1RTS, CLK_OUT2]}
  20: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: [USB_OTG_D+, ADC2_CH9, U1CTS, CLK_OUT1]}
  21: {power_domain: VDD3P3_RTC_IO, rtc: true, functions: []}
  26: {power_domain: VDD_SPI, functions: [SPICS1], at_reset: PUP}
  27: {power_domain: VDD_SPI, functions: [SPIHD], at_reset: PUP}
  28: {power_domain: VDD_SPI, functions: [SPIWP], at_reset: PUP}
  29: {power_domain: VDD_SPI, functions: [SPICS0], at_reset: PUP}
  30: {power_domain: VDD_SPI, functions: [SPICLK], at_reset: PUP}
  31: {power_domain: VDD_SPI, functions: [SPIQ], at_reset: PUP}
  32: {power_domain: VDD_SPI, functions: [SPID], at_reset: PUP}
  33: {power_domain: VDD_SPI/VDD3P3_CPU, functions: [FSPIHD, SPIIO4]}
  34: {power_domain: VDD_SPI/VDD3P3_CPU, functions: [FSPICS0, SPIIO5]}
  35: {power_domain: VDD_SPI/VDD3P3_CPU, functions: [FSPID, SPIIO6]}
  36: {power_domain: VDD_SPI/VDD3P3_CPU, functions: [FSPICLK, SPIIO7]}
  37: {power_domain: VDD_SPI/VDD3P3_CPU, functions: [FSPIQ, SPIDQS]}
  38: {power_domain: VDD3P3_CPU, functions: [FSPIWP]}
  39: {power_domain: VDD3P3_CPU, functions: [MTCK, CLK_OUT3]}
  40: {power_domain: VDD3P3_CPU, functions: [MTDO, CLK_OUT2]}
  41: {power_domain: VDD3P3_CPU, functions: [MTDI, CLK_OUT1]}
  42: {power_domain: VDD3P3_CPU, functions: [MTMS]}
  43: {power_domain: VDD3P3_CPU, functions: [U0TXD, CLK_OUT1], at_reset: PUP}
  44: {power_domain: VDD3P3_CPU, functions: [U0RXD, CLK_OUT2], at_reset: PUP}
  45: {power_domain: VDD3P3_CPU, functions: [], strapping: VDD_SPI Voltage select, at_reset: PDOWN}
  46: {power_domain: VDD3P3_CPU, functions: [], strapping: UART print en/Low for Download Mode (ignored when GPIO0 is High), at_reset: PDOWN}

soc:
  ESP32-S2FH2: {reserved_pins: [33, 36, 35, 34, 32, 31]}  # quad FLASH
  ESP32-S2FH4: {reserved_pins: [33, 36, 35, 34, 32, 31]}  # quad FLASH
  ESP32-S2FN4R2: {reserved_pins: [29, 33, 36, 35, 34, 32, 31]}  # quad PSRAM, qaud FLASH
  ESP32-S2R2: {reserved_pins: [29, 36, 35, 34, 32, 31]}  # quad PSRAM
  ESP32-S2: {reserved_pins: []}
